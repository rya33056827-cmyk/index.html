<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>runotoks</title>
  <style>
    :root {
      --bg-page: #f2f5f9;
      --bg-card-light: #ffffff;
      --bg-dark: #0f172a;
      --bg-dark-2: #162033;
      --bg-dark-3: #1e293b;
      --bg-input-dark: #0a101d;

      --text-dark: #0f172a;
      --text-muted: #64748b;
      --text-light: #f8fafc;
      --text-light-muted: #cbd5e1;

      --green: #22c55e;
      --green-dark: #16a34a;
      --amber: #f59e0b;
      --blue: #2563eb;
      --red: #ef4444;

      --border-light: #e2e8f0;
      --border-dark: rgba(148, 163, 184, 0.2);

      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 26px;
      --radius-pill: 999px;

      --shadow-sm: 0 2px 10px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.12);
      --shadow-lg: 0 20px 48px rgba(2, 6, 23, 0.45);

      --font-default: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-serif: Georgia, 'Times New Roman', Times, serif;
      --font-rounded: 'Trebuchet MS', 'Comic Sans MS', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-default);
      background: var(--bg-page);
      color: var(--text-dark);
      min-height: 100vh;
      padding-bottom: 108px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* TOP HEADER */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
      padding: 10px 16px;
    }

    .top-bar-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--bg-dark);
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--green);
      line-height: 1.1;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .owner-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-light);
      background: #f8fafc;
      color: var(--text-dark);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .owner-pill.is-owner {
      background: rgba(34, 197, 94, 0.14);
      border-color: rgba(34, 197, 94, 0.45);
      color: #15803d;
    }

    .header-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      background: #fff;
      font-size: 17px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .cart-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-dark);
      color: #fff;
      border: none;
      border-radius: var(--radius-pill);
      padding: 8px 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .cart-badge {
      background: var(--blue);
      color: #fff;
      min-width: 24px;
      height: 24px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      padding: 0 6px;
    }

    /* PAGES ARCHITECTURE */
    .app-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px;
    }

    .page-view {
      display: none;
      animation: pageFadeIn 0.18s ease;
    }

    .page-view.active {
      display: block;
    }

    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* COMMON CONTROLS & FORMS */
    .page-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .owner-panel-card {
      background: var(--bg-dark);
      color: var(--text-light);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 18px;
      border: 1px solid var(--border-dark);
      box-shadow: var(--shadow-md);
    }

    .owner-panel-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--green);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .field-label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-light-muted);
      margin-bottom: 5px;
    }

    .dark-field, .dark-area {
      width: 100%;
      background: var(--bg-input-dark);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      padding: 11px 13px;
      margin-bottom: 10px;
      outline: none;
    }

    .dark-field:focus, .dark-area:focus {
      border-color: var(--green);
    }

    .dark-area {
      min-height: 78px;
      resize: vertical;
    }

    .file-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn-file-select {
      background: #e2e8f0;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .file-status {
      font-size: 12.5px;
      font-family: var(--font-mono);
      color: var(--text-light-muted);
    }

    .btn-green-full {
      width: 100%;
      background: var(--green);
      color: #052e16;
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-blue {
      background: var(--blue);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* CLEAN EMPTY STATES */
    .empty-state-box {
      background: #ffffff;
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius-lg);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state-box.dark-empty {
      background: var(--bg-dark-2);
      border-color: rgba(148, 163, 184, 0.22);
      color: var(--text-light-muted);
    }

    /* =========================================================================
       FEED PAGE ("ЛЕНТА" — ONLY OWNER POSTS, NO HERO/BANNERS)
       ========================================================================= */
    .feed-wrapper {
      background: var(--bg-dark);
      color: var(--text-light);
      border-radius: var(--radius-xl);
      padding: 18px 16px;
      border: 1px solid var(--border-dark);
      box-shadow: var(--shadow-lg);
    }

    .post-card {
      background: var(--bg-dark-2);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 14px;
      position: relative;
      cursor: pointer;
      transition: border-color 0.18s ease;
    }

    .post-card:hover {
      border-color: rgba(34, 197, 94, 0.45);
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .post-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--blue));
      color: #fff;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dots-btn {
      background: none;
      border: none;
      color: var(--text-light-muted);
      font-size: 22px;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .dots-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .dots-menu {
      position: absolute;
      top: 48px;
      right: 16px;
      background: #1e293b;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      z-index: 30;
      min-width: 190px;
      display: none;
      overflow: hidden;
    }

    .dots-menu.open {
      display: block;
    }

    .dots-menu button {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: #f8fafc;
      padding: 11px 14px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dots-menu button:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .dots-menu button.delete-opt {
      color: #f87171;
    }

    .post-text {
      font-size: 15px;
      line-height: 1.55;
      color: #f1f5f9;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .post-media {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #060a12;
      margin-bottom: 12px;
    }

    .post-media img, .post-media video {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
    }

    .sound-corner-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .post-footer-btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill-stat-btn {
      background: #233047;
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: var(--radius-pill);
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================================================================
       PURCHASES PAGE ("ПОКУПКИ" — ONLY OWNER PRODUCTS)
       ========================================================================= */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .product-thumb {
      width: 100%;
      height: 175px;
      border-radius: var(--radius-md);
      background: #0f172a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 42px;
    }

    .product-thumb img, .product-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .product-short-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price-tag {
      font-size: 19px;
      font-weight: 800;
      color: var(--green-dark);
      margin-top: 6px;
    }

    .product-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-buy-now {
      flex: 1;
      background: var(--green);
      color: #052e16;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-to-cart {
      background: var(--bg-dark);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================================================================
       DETAIL PAGES (PRODUCT FULL PAGE & POST FULL PAGE)
       ========================================================================= */
    .detail-card-light {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 20px;
      box-shadow: var(--shadow-md);
    }

    .detail-card-dark {
      background: var(--bg-dark);
      color: var(--text-light);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-xl);
      padding: 20px;
      box-shadow: var(--shadow-lg);
    }

    .back-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-light);
      background: #ffffff;
      color: var(--text-dark);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .back-nav-btn.dark {
      background: var(--bg-dark-3);
      color: #fff;
      border-color: var(--border-dark);
    }

    .detail-media-large {
      width: 100%;
      max-height: 440px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #070b14;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-media-large img, .detail-media-large video {
      width: 100%;
      max-height: 440px;
      object-fit: contain;
      display: block;
    }

    /* =========================================================================
       CHAT ROULETTE + VIDEO/AUDIO CALLS + FONTS
       ========================================================================= */
    .roulette-card {
      background: var(--bg-dark);
      color: var(--text-light);
      border-radius: var(--radius-xl);
      padding: 18px;
      border: 1px solid var(--border-dark);
      box-shadow: var(--shadow-lg);
    }

    .roulette-top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-dark);
      margin-bottom: 14px;
    }

    .roulette-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 15px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .status-dot.searching {
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
    }

    .roulette-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .r-btn {
      padding: 8px 13px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: var(--bg-dark-3);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .r-btn.next-btn {
      background: var(--amber);
      color: #1f1200;
      border-color: var(--amber);
    }

    .r-btn.call-btn {
      background: var(--green);
      color: #052e16;
      border-color: var(--green);
    }

    .r-btn.end-call-btn {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    .call-stage {
      display: none;
      background: #060a12;
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 14px;
    }

    .call-stage.active {
      display: block;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    .video-box {
      background: #111827;
      border-radius: 14px;
      height: 190px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-label {
      position: absolute;
      bottom: 8px;
      left: 10px;
      background: rgba(15, 23, 42, 0.8);
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .font-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      background: var(--bg-dark-2);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      border: 1px solid var(--border-dark);
    }

    .font-chip {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: var(--bg-input-dark);
      color: #e2e8f0;
      font-size: 12px;
      cursor: pointer;
    }

    .font-chip.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      font-weight: 700;
    }

    .roulette-messages {
      height: 290px;
      overflow-y: auto;
      background: var(--bg-input-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .msg-bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 14.5px;
      line-height: 1.45;
      word-break: break-word;
    }

    .msg-bubble.peer {
      align-self: flex-start;
      background: #1e293b;
      color: #f8fafc;
      border-bottom-left-radius: 4px;
    }

    .msg-bubble.me {
      align-self: flex-end;
      background: var(--blue);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .msg-bubble.system {
      align-self: center;
      background: rgba(34, 197, 94, 0.14);
      color: #86efac;
      font-size: 12.5px;
      border-radius: var(--radius-pill);
      padding: 6px 14px;
    }

    .roulette-form {
      display: flex;
      gap: 8px;
    }

    /* BOTTOM DOCK */
    .bottom-dock-bar {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      z-index: 150;
      display: flex;
      justify-content: center;
      padding: 0 12px;
      pointer-events: none;
    }

    .bottom-dock-inner {
      pointer-events: auto;
      background: rgba(13, 19, 33, 0.96);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 26px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-lg);
    }

    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 16px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: #1b2538;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.16s ease;
    }

    .nav-pill.active {
      background: #ffffff;
      color: #0f172a;
      border-color: #ffffff;
    }

    .nav-round-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--amber);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-round-btn.profile {
      background: var(--green);
      color: #052e16;
    }

    /* MODALS & TOASTS */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(4px);
      z-index: 220;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      background: var(--bg-dark);
      color: #fff;
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-box.light {
      background: #ffffff;
      color: var(--text-dark);
    }

    .modal-head {
      padding: 15px 18px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
      font-size: 17px;
    }

    .modal-body {
      padding: 18px;
      overflow-y: auto;
      flex: 1;
    }

    .toast-box {
      position: fixed;
      top: 70px;
      right: 16px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: var(--bg-dark);
      color: #fff;
      border-left: 4px solid var(--green);
      padding: 11px 15px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="brand" onclick="switchPage('feedPage')">
        <div class="brand-icon">R</div>
        <div class="brand-title">runotoks</div>
      </div>

      <div class="header-controls">
        <button type="button" class="owner-pill is-owner" id="ownerModeBtn" onclick="openModal('ownerAuthModal')">
          👑 Владелец
        </button>
        <button type="button" class="header-icon-btn" onclick="switchPage('roulettePage')" title="Чат-рулетка">
          💬
        </button>
        <button type="button" class="cart-btn" onclick="openModal('cartModal')" title="Корзина">
          <span>🛒</span>
          <span class="cart-badge" id="cartBadge">0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="toast-box" id="toastBox"></div>

  <main class="app-container">

    <!-- =====================================================================
         PAGE 1: ЛЕНТА (ПОЛНОСТЬЮ ПУСТАЯ ОТДЕЛЬНАЯ СТРАНИЦА ДЛЯ ПОСТОВ ВЛАДЕЛЬЦА)
         ===================================================================== -->
    <section class="page-view active" id="feedPage">
      <div class="feed-wrapper">
        <div class="page-header-row">
          <h2 style="font-size:21px; font-weight:800;">🏠 Лента</h2>
          <span style="font-size:12.5px; color:#94a3b8;" id="feedCountLabel">Постов: 0</span>
        </div>

        <!-- Форма публикации (ТОЛЬКО ВЛАДЕЛЕЦ) -->
        <div class="owner-panel-card" id="feedComposerBox" style="background:#162033; margin-bottom:18px;">
          <div class="owner-panel-title">
            <span>✍️ Новая публикация</span>
          </div>

          <label class="field-label">Ссылка на фото или видео (необязательно)</label>
          <input type="text" id="feedUrlInput" class="dark-field" placeholder="https://..." />

          <label class="field-label">Текст публикации</label>
          <textarea id="feedTextInput" class="dark-area" placeholder="Напишите текст публикации..."></textarea>

          <div class="file-row">
            <span class="field-label" style="margin:0;">Фото/видео:</span>
            <button type="button" class="btn-file-select" onclick="document.getElementById('feedFileInput').click()">
              Вибрати файл
            </button>
            <input type="file" id="feedFileInput" accept="image/*,video/*" style="display:none;" onchange="onFeedFileChange(this)" />
            <span class="file-status" id="feedFileLabel">Файл не выбран</span>
          </div>

          <button type="button" class="btn-green-full" onclick="createFeedPost()">
            Опубликовать
          </button>
        </div>

        <!-- Список постов (изначально пустой) -->
        <div id="feedPostsList"></div>
      </div>
    </section>

    <!-- =====================================================================
         PAGE 2: ОТДЕЛЬНАЯ СТРАНИЦА ПОСТА
         ===================================================================== -->
    <section class="page-view" id="postDetailPage">
      <button type="button" class="back-nav-btn dark" onclick="switchPage('feedPage')">
        ← Назад в ленту
      </button>
      <div class="detail-card-dark" id="postDetailContainer"></div>
    </section>

    <!-- =====================================================================
         PAGE 3: ПОКУПКИ (ПОЛНОСТЬЮ ПУСТАЯ ОТДЕЛЬНАЯ СТРАНИЦА ДЛЯ ТОВАРОВ ВЛАДЕЛЬЦА)
         ===================================================================== -->
    <section class="page-view" id="purchasesPage">
      <div class="page-header-row">
        <h2 style="font-size:22px; font-weight:800;">🛍️ Покупки</h2>
        <span style="font-size:13px; color:var(--text-muted); font-weight:700;" id="productsCountLabel">Товаров: 0</span>
      </div>

      <!-- Форма добавления товара (ТОЛЬКО ВЛАДЕЛЕЦ) -->
      <div class="owner-panel-card" id="productComposerBox">
        <div class="owner-panel-title">
          <span>➕ Добавить товар</span>
        </div>

        <label class="field-label">Название товара</label>
        <input type="text" id="prodNameInput" class="dark-field" placeholder="Название товара..." />

        <label class="field-label">Стоимость (в ₴)</label>
        <input type="number" id="prodPriceInput" class="dark-field" placeholder="Цена..." min="0" />

        <label class="field-label">Описание товара</label>
        <textarea id="prodDescInput" class="dark-area" placeholder="Описание товара..."></textarea>

        <label class="field-label">Ссылка на фото или видео (необязательно)</label>
        <input type="text" id="prodUrlInput" class="dark-field" placeholder="https://..." />

        <div class="file-row">
          <span class="field-label" style="margin:0;">Фото/видео:</span>
          <button type="button" class="btn-file-select" onclick="document.getElementById('prodFileInput').click()">
            Вибрати файл
          </button>
          <input type="file" id="prodFileInput" accept="image/*,video/*" style="display:none;" onchange="onProdFileChange(this)" />
          <span class="file-status" id="prodFileLabel">Файл не выбран</span>
        </div>

        <button type="button" class="btn-green-full" onclick="addOwnerProduct()">
          Выставить товар
        </button>
      </div>

      <!-- Список товаров (изначально пустой) -->
      <div id="productsGridContainer"></div>
    </section>

    <!-- =====================================================================
         PAGE 4: ОТДЕЛЬНАЯ СТРАНИЦА ТОВАРА
         ===================================================================== -->
    <section class="page-view" id="productDetailPage">
      <button type="button" class="back-nav-btn" onclick="switchPage('purchasesPage')">
        ← Назад в покупки
      </button>
      <div class="detail-card-light" id="productDetailContainer"></div>
    </section>

    <!-- =====================================================================
         PAGE 5: ЧАТ-РУЛЕТКА, ЗВОНКИ И ШРИФТЫ
         ===================================================================== -->
    <section class="page-view" id="roulettePage">
      <div class="roulette-card">
        <div class="roulette-top-bar">
          <div class="roulette-status">
            <span class="status-dot" id="rouletteDot"></span>
            <span id="roulettePeerTitle">Собеседник #4821 (Онлайн)</span>
          </div>

          <div class="roulette-actions">
            <button type="button" class="r-btn next-btn" onclick="rouletteNextPeer()">🎲 Следующий</button>
            <button type="button" class="r-btn call-btn" onclick="startCall('audio')">📞 Аудиозвонок</button>
            <button type="button" class="r-btn call-btn" onclick="startCall('video')">📹 Видеозвонок</button>
            <button type="button" class="r-btn end-call-btn" id="endCallBtn" style="display:none;" onclick="endCall()">📵 Сбросить</button>
          </div>
        </div>

        <div class="call-stage" id="callStage">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong id="callStatusText" style="color:var(--green);">🔊 Идёт звонок...</strong>
            <span id="callTimerText" style="font-family:var(--font-mono); font-size:13px;">00:00</span>
          </div>
          <div class="video-grid">
            <div class="video-box">
              <video id="localVideo" autoplay muted playsinline></video>
              <span class="video-label">Вы</span>
            </div>
            <div class="video-box">
              <div style="font-size:46px;">👤</div>
              <div style="font-size:13px; color:#94a3b8; margin-top:6px;" id="remotePeerCallName">Собеседник на связи</div>
              <span class="video-label">Собеседник</span>
            </div>
          </div>
        </div>

        <div class="font-toolbar">
          <span style="font-size:12px; font-weight:700; color:#94a3b8; margin-right:4px;">Шрифт:</span>
          <button type="button" class="font-chip active" data-font="default" onclick="setChatFont('default', this)">Обычный</button>
          <button type="button" class="font-chip" data-font="mono" style="font-family:var(--font-mono);" onclick="setChatFont('mono', this)">Моно</button>
          <button type="button" class="font-chip" data-font="serif" style="font-family:var(--font-serif);" onclick="setChatFont('serif', this)">Классика</button>
          <button type="button" class="font-chip" data-font="rounded" style="font-family:var(--font-rounded);" onclick="setChatFont('rounded', this)">Мягкий</button>
          <button type="button" class="font-chip" data-font="bold-caps" style="font-weight:800; letter-spacing:0.06em;" onclick="setChatFont('bold-caps', this)">ЖИРНЫЙ</button>
          <button type="button" class="font-chip" data-font="fancy" onclick="setChatFont('fancy', this)">𝔖𝔱𝔶𝔩𝔢</button>
        </div>

        <div class="roulette-messages" id="rouletteMessages"></div>

        <form class="roulette-form" onsubmit="sendRouletteMessage(event)">
          <input
            type="text"
            id="rouletteInput"
            class="dark-field"
            style="margin-bottom:0; flex:1;"
            placeholder="Напишите сообщение..."
            required
          />
          <button type="submit" class="btn-blue" style="padding:11px 18px; border-radius:12px;">
            Отпр.
          </button>
        </form>
      </div>
    </section>

    <!-- =====================================================================
         PAGE 6: ПОИСК
         ===================================================================== -->
    <section class="page-view" id="searchPage">
      <div class="roulette-card">
        <h2 style="font-size:20px; font-weight:800; margin-bottom:12px;">🔍 Поиск</h2>
        <input
          type="text"
          id="peopleSearchInput"
          class="dark-field"
          placeholder="Введите имя..."
          oninput="renderPeopleList(this.value)"
        />
        <div id="peopleListContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>
    </section>

    <!-- =====================================================================
         PAGE 7: ПРОФИЛЬ
         ===================================================================== -->
    <section class="page-view" id="profilePage">
      <div class="roulette-card">
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:16px;">
          <div class="avatar-circle" style="width:56px; height:56px; font-size:22px;" id="profileLetter">R</div>
          <div>
            <div style="font-size:19px; font-weight:800;" id="profileNameTitle">runotoks</div>
            <div style="font-size:13px; color:#94a3b8;" id="profileRoleBadge">Владелец</div>
          </div>
        </div>

        <label class="field-label">Имя</label>
        <input type="text" id="profileNameInput" class="dark-field" />

        <label class="field-label">О себе</label>
        <textarea id="profileBioInput" class="dark-area" style="min-height:66px;"></textarea>

        <button type="button" class="btn-green-full" onclick="saveProfile()">
          Сохранить
        </button>
      </div>
    </section>

  </main>

  <!-- BOTTOM NAVIGATION DOCK ("ПОКУПКИ" LEFT OF "ЛЕНТА" IN SAME ROW) -->
  <nav class="bottom-dock-bar">
    <div class="bottom-dock-inner">
      <button type="button" class="nav-pill" id="navPurchasesBtn" onclick="switchPage('purchasesPage')">
        <span>🛍️</span>
        <span>Покупки</span>
      </button>

      <button type="button" class="nav-pill active" id="navFeedBtn" onclick="switchPage('feedPage')">
        <span>🏠</span>
        <span>Лента</span>
      </button>

      <button type="button" class="nav-round-btn" onclick="switchPage('searchPage')" title="Поиск">
        🔍
      </button>

      <button type="button" class="nav-round-btn profile" onclick="switchPage('profilePage')" title="Профиль">
        👤
      </button>
    </div>
  </nav>

  <!-- CART MODAL -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal-box light">
      <div class="modal-head">
        <span>🛒 Корзина</span>
        <button type="button" style="background:none; border:none; font-size:18px; cursor:pointer;" onclick="closeModal('cartModal')">✕</button>
      </div>
      <div class="modal-body" id="cartBody"></div>
    </div>
  </div>

  <!-- OWNER ACCESS MODAL -->
  <div class="modal-overlay" id="ownerAuthModal">
    <div class="modal-box">
      <div class="modal-head">
        <span>👑 Доступ владельца</span>
        <button type="button" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;" onclick="closeModal('ownerAuthModal')">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label">PIN-код владельца (по умолчанию: 1234)</label>
        <input type="password" id="ownerPinInput" class="dark-field" placeholder="PIN (1234)" value="1234" />
        <div style="display:flex; gap:10px;">
          <button type="button" class="btn-green-full" onclick="setOwnerMode(true)">Владелец</button>
          <button type="button" class="btn-blue" style="width:100%; border-radius:12px;" onclick="setOwnerMode(false)">Гость</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DB_KEY = 'runotoks_pure_pages_v3';

    const DEFAULT_STATE = {
      isOwner: true,
      ownerPin: '1234',
      profile: {
        name: 'runotoks',
        bio: ''
      },
      products: [],
      posts: [],
      cart: [],
      selectedFont: 'default',
      roulettePeer: 'Собеседник #4821',
      rouletteChat: [
        { type: 'system', text: 'Чат-рулетка активна.' }
      ]
    };

    let appState = loadAppState();
    let pendingProdMedia = { url: '', type: 'none' };
    let pendingFeedMedia = { url: '', type: 'none' };
    let callTimerInterval = null;
    let callSeconds = 0;
    let localMediaStream = null;

    function loadAppState() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        return { ...JSON.parse(JSON.stringify(DEFAULT_STATE)), ...JSON.parse(raw) };
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveAppState() {
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(appState));
      } catch (e) {}
    }

    function toast(msg) {
      const box = document.getElementById('toastBox');
      const div = document.createElement('div');
      div.className = 'toast';
      div.textContent = msg;
      box.appendChild(div);
      setTimeout(() => div.remove(), 2500);
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* NAVIGATION */
    function switchPage(pageId) {
      document.querySelectorAll('.page-view').forEach(sec => sec.classList.remove('active'));
      const target = document.getElementById(pageId);
      if (target) target.classList.add('active');

      document.getElementById('navPurchasesBtn').classList.toggle('active', pageId === 'purchasesPage' || pageId === 'productDetailPage');
      document.getElementById('navFeedBtn').classList.toggle('active', pageId === 'feedPage' || pageId === 'postDetailPage');

      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (pageId === 'purchasesPage') renderProductsPage();
      if (pageId === 'feedPage') renderFeedPage();
      if (pageId === 'roulettePage') renderRouletteChat();
      if (pageId === 'searchPage') renderPeopleList('');
      if (pageId === 'profilePage') renderProfilePage();
    }

    function openModal(id) {
      document.getElementById(id).classList.add('open');
      if (id === 'cartModal') renderCartModal();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    /* OWNER ACCESS */
    function setOwnerMode(enableOwner) {
      if (enableOwner) {
        const pin = document.getElementById('ownerPinInput').value.trim();
        if (pin !== appState.ownerPin) {
          toast('Неверный PIN-код');
          return;
        }
        appState.isOwner = true;
        toast('Режим Владельца включён');
      } else {
        appState.isOwner = false;
        toast('Режим Гостя включён');
      }
      saveAppState();
      applyOwnerPermissions();
      closeModal('ownerAuthModal');
    }

    function applyOwnerPermissions() {
      const isOwner = Boolean(appState.isOwner);
      const pill = document.getElementById('ownerModeBtn');
      pill.classList.toggle('is-owner', isOwner);
      pill.textContent = isOwner ? '👑 Владелец' : '👀 Гость';

      document.getElementById('productComposerBox').style.display = isOwner ? 'block' : 'none';
      document.getElementById('feedComposerBox').style.display = isOwner ? 'block' : 'none';
    }

    /* PURCHASES PAGE & PRODUCT DETAIL PAGE */
    function onProdFileChange(input) {
      const file = input.files && input.files[0];
      if (!file) {
        pendingProdMedia = { url: '', type: 'none' };
        document.getElementById('prodFileLabel').textContent = 'Файл не выбран';
        return;
      }
      document.getElementById('prodFileLabel').textContent = file.name;
      const type = file.type.startsWith('video/') ? 'video' : 'image';
      const reader = new FileReader();
      reader.onload = e => {
        pendingProdMedia = { url: e.target.result, type };
      };
      reader.readAsDataURL(file);
    }

    function addOwnerProduct() {
      if (!appState.isOwner) return;
      const name = document.getElementById('prodNameInput').value.trim();
      const price = Number(document.getElementById('prodPriceInput').value);
      const desc = document.getElementById('prodDescInput').value.trim();
      const url = document.getElementById('prodUrlInput').value.trim();

      if (!name || !price || !desc) {
        toast('Заполните название, стоимость и описание');
        return;
      }

      let mediaUrl = '';
      let mediaType = 'none';
      if (pendingProdMedia.url) {
        mediaUrl = pendingProdMedia.url;
        mediaType = pendingProdMedia.type;
      } else if (url) {
        mediaUrl = url;
        mediaType = /\.(mp4|webm|ogg)(\?|$)/i.test(url) ? 'video' : 'image';
      }

      appState.products.unshift({
        id: 'prod-' + Date.now(),
        name,
        price,
        desc,
        mediaUrl,
        mediaType,
        createdAt: new Date().toLocaleDateString('ru-RU')
      });
      saveAppState();

      document.getElementById('prodNameInput').value = '';
      document.getElementById('prodPriceInput').value = '';
      document.getElementById('prodDescInput').value = '';
      document.getElementById('prodUrlInput').value = '';
      document.getElementById('prodFileInput').value = '';
      document.getElementById('prodFileLabel').textContent = 'Файл не выбран';
      pendingProdMedia = { url: '', type: 'none' };

      renderProductsPage();
      toast('Товар добавлен');
    }

    function renderProductsPage() {
      const container = document.getElementById('productsGridContainer');
      document.getElementById('productsCountLabel').textContent = `Товаров: ${appState.products.length}`;

      if (!appState.products.length) {
        container.innerHTML = `<div class="empty-state-box">Товаров пока нет</div>`;
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'products-grid';

      appState.products.forEach(prod => {
        let thumbHtml = '📦';
        if (prod.mediaUrl) {
          thumbHtml = prod.mediaType === 'video'
            ? `<video src="${esc(prod.mediaUrl)}" muted playsinline></video>`
            : `<img src="${esc(prod.mediaUrl)}" alt="${esc(prod.name)}" />`;
        }

        const card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = () => openProductDetailPage(prod.id);
        card.innerHTML = `
          <div>
            <div class="product-thumb">${thumbHtml}</div>
            <div style="margin-top:12px;">
              <div class="product-name">${esc(prod.name)}</div>
              <div class="product-short-desc">${esc(prod.desc)}</div>
              <div class="product-price-tag">${prod.price.toLocaleString('ru-RU')} ₴</div>
            </div>
          </div>
          <div class="product-card-actions" onclick="event.stopPropagation()">
            <button type="button" class="btn-buy-now" onclick="buyProductInstant('${prod.id}')">Купить</button>
            <button type="button" class="btn-to-cart" onclick="addProductToCart('${prod.id}')">🛒 Корзина</button>
          </div>
        `;
        grid.appendChild(card);
      });

      container.innerHTML = '';
      container.appendChild(grid);
    }

    function openProductDetailPage(prodId) {
      const prod = appState.products.find(p => p.id === prodId);
      if (!prod) return;

      let mediaBlock = `<div class="detail-media-large" style="height:240px; font-size:64px; color:#fff;">📦</div>`;
      if (prod.mediaUrl) {
        mediaBlock = prod.mediaType === 'video'
          ? `<div class="detail-media-large"><video src="${esc(prod.mediaUrl)}" controls playsinline></video></div>`
          : `<div class="detail-media-large"><img src="${esc(prod.mediaUrl)}" alt="${esc(prod.name)}" /></div>`;
      }

      const deleteBtnHtml = appState.isOwner
        ? `<button type="button" style="background:#ef4444; color:#fff; border:none; border-radius:12px; padding:12px 16px; font-weight:700; cursor:pointer;" onclick="deleteOwnerProduct('${prod.id}')">🗑️ Удалить</button>`
        : '';

      document.getElementById('productDetailContainer').innerHTML = `
        ${mediaBlock}
        <h2 style="font-size:26px; font-weight:800; margin-bottom:8px;">${esc(prod.name)}</h2>
        <div style="font-size:24px; font-weight:800; color:#16a34a; margin-bottom:14px;">${prod.price.toLocaleString('ru-RU')} ₴</div>
        <div style="font-size:15.5px; line-height:1.65; color:#1e293b; white-space:pre-wrap; margin-bottom:20px;">${esc(prod.desc)}</div>
        <div style="display:flex; flex-wrap:wrap; gap:10px;">
          <button type="button" class="btn-buy-now" style="padding:14px 22px; font-size:16px;" onclick="buyProductInstant('${prod.id}')">Купить</button>
          <button type="button" class="btn-to-cart" style="padding:14px 22px; font-size:16px;" onclick="addProductToCart('${prod.id}')">🛒 В корзину</button>
          ${deleteBtnHtml}
        </div>
      `;

      switchPage('productDetailPage');
    }

    function deleteOwnerProduct(prodId) {
      appState.products = appState.products.filter(p => p.id !== prodId);
      saveAppState();
      toast('Товар удалён');
      switchPage('purchasesPage');
    }

    function addProductToCart(prodId) {
      const prod = appState.products.find(p => p.id === prodId);
      if (!prod) return;
      const item = appState.cart.find(c => c.id === prodId);
      if (item) item.qty += 1;
      else appState.cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
      saveAppState();
      updateCartCounter();
      toast('Добавлено в корзину');
    }

    function buyProductInstant(prodId) {
      addProductToCart(prodId);
      openModal('cartModal');
    }

    function updateCartCounter() {
      const count = appState.cart.reduce((s, i) => s + i.qty, 0);
      document.getElementById('cartBadge').textContent = count;
    }

    function renderCartModal() {
      const body = document.getElementById('cartBody');
      if (!appState.cart.length) {
        body.innerHTML = `<div style="text-align:center; padding:24px; color:#64748b;">Корзина пуста</div>`;
        return;
      }
      let sum = 0;
      const itemsHtml = appState.cart.map(item => {
        sum += item.price * item.qty;
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #e2e8f0;">
            <div>
              <div style="font-weight:800;">${esc(item.name)}</div>
              <div style="font-size:13px; color:#64748b;">${item.price.toLocaleString('ru-RU')} ₴ × ${item.qty}</div>
            </div>
            <button type="button" style="background:#ef4444; color:#fff; border:none; border-radius:8px; padding:5px 10px; cursor:pointer;" onclick="removeFromCart('${item.id}')">✕</button>
          </div>
        `;
      }).join('');

      body.innerHTML = `
        ${itemsHtml}
        <div style="font-size:18px; font-weight:800; margin:14px 0;">Итого: ${sum.toLocaleString('ru-RU')} ₴</div>
        <button type="button" class="btn-green-full" onclick="completePurchase()">Купить</button>
      `;
    }

    function removeFromCart(id) {
      appState.cart = appState.cart.filter(i => i.id !== id);
      saveAppState();
      updateCartCounter();
      renderCartModal();
    }

    function completePurchase() {
      appState.cart = [];
      saveAppState();
      updateCartCounter();
      closeModal('cartModal');
      toast('Покупка оформлена');
    }

    /* FEED PAGE & POST DETAIL PAGE */
    function onFeedFileChange(input) {
      const file = input.files && input.files[0];
      if (!file) {
        pendingFeedMedia = { url: '', type: 'none' };
        document.getElementById('feedFileLabel').textContent = 'Файл не выбран';
        return;
      }
      document.getElementById('feedFileLabel').textContent = file.name;
      const type = file.type.startsWith('video/') ? 'video' : 'image';
      const reader = new FileReader();
      reader.onload = e => {
        pendingFeedMedia = { url: e.target.result, type };
      };
      reader.readAsDataURL(file);
    }

    function createFeedPost() {
      if (!appState.isOwner) return;
      const url = document.getElementById('feedUrlInput').value.trim();
      const text = document.getElementById('feedTextInput').value.trim();

      if (!text && !url && !pendingFeedMedia.url) {
        toast('Добавьте текст, фото или видео');
        return;
      }

      let mediaUrl = '';
      let mediaType = 'none';
      if (pendingFeedMedia.url) {
        mediaUrl = pendingFeedMedia.url;
        mediaType = pendingFeedMedia.type;
      } else if (url) {
        mediaUrl = url;
        mediaType = /\.(mp4|webm|ogg)(\?|$)/i.test(url) ? 'video' : 'image';
      }

      appState.posts.unshift({
        id: 'post-' + Date.now(),
        author: appState.profile.name,
        date: new Date().toLocaleDateString('ru-RU'),
        text,
        mediaUrl,
        mediaType,
        soundOn: false,
        likes: 0,
        liked: false,
        comments: []
      });
      saveAppState();

      document.getElementById('feedUrlInput').value = '';
      document.getElementById('feedTextInput').value = '';
      document.getElementById('feedFileInput').value = '';
      document.getElementById('feedFileLabel').textContent = 'Файл не выбран';
      pendingFeedMedia = { url: '', type: 'none' };

      renderFeedPage();
      toast('Опубликовано');
    }

    function renderFeedPage() {
      const list = document.getElementById('feedPostsList');
      document.getElementById('feedCountLabel').textContent = `Постов: ${appState.posts.length}`;

      if (!appState.posts.length) {
        list.innerHTML = `<div class="empty-state-box dark-empty">Публикаций пока нет</div>`;
        return;
      }

      list.innerHTML = '';
      appState.posts.forEach(post => {
        let mediaHtml = '';
        if (post.mediaUrl) {
          mediaHtml = post.mediaType === 'video'
            ? `<div class="post-media" onclick="event.stopPropagation()">
                 <video src="${esc(post.mediaUrl)}" ${post.soundOn ? '' : 'muted'} controls playsinline></video>
                 <button type="button" class="sound-corner-btn" onclick="toggleFeedSound('${post.id}')">${post.soundOn ? '🔊' : '🔇'}</button>
               </div>`
            : `<div class="post-media">
                 <img src="${esc(post.mediaUrl)}" alt="Фото" />
                 <button type="button" class="sound-corner-btn" onclick="event.stopPropagation(); toggleFeedSound('${post.id}')">${post.soundOn ? '🔊' : '🔇'}</button>
               </div>`;
        }

        const deleteMenuHtml = appState.isOwner
          ? `<button type="button" class="delete-opt" onclick="deleteFeedPost('${post.id}')">🗑️ Удалить пост</button>`
          : '';

        const card = document.createElement('article');
        card.className = 'post-card';
        card.onclick = () => openPostDetailPage(post.id);
        card.innerHTML = `
          <div class="post-header">
            <div class="post-user">
              <div class="avatar-circle">${esc(post.author.slice(0, 1).toUpperCase())}</div>
              <div>
                <div style="font-weight:800; font-size:15px;">${esc(post.author)}</div>
                <div style="font-size:12px; color:#94a3b8;">${esc(post.date)}</div>
              </div>
            </div>
            <button type="button" class="dots-btn" onclick="event.stopPropagation(); toggleDotsMenu('${post.id}')">⋮</button>
          </div>

          <div class="dots-menu" id="dots-${post.id}" onclick="event.stopPropagation()">
            <button type="button" onclick="shareFeedPost('${post.id}')">📤 Отправить</button>
            <button type="button" onclick="openPostDetailPage('${post.id}')">📄 Открыть полностью</button>
            ${deleteMenuHtml}
          </div>

          ${post.text ? `<div class="post-text">${esc(post.text)}</div>` : ''}
          ${mediaHtml}

          <div class="post-footer-btns" onclick="event.stopPropagation()">
            <button type="button" class="pill-stat-btn" onclick="likeFeedPost('${post.id}')">
              ${post.liked ? '❤️' : '♡'} Лайк (${post.likes})
            </button>
            <button type="button" class="pill-stat-btn" onclick="openPostDetailPage('${post.id}')">
              💬 Комментарии (${post.comments.length})
            </button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function toggleDotsMenu(postId) {
      document.querySelectorAll('.dots-menu').forEach(m => {
        if (m.id !== `dots-${postId}`) m.classList.remove('open');
      });
      const el = document.getElementById(`dots-${postId}`);
      if (el) el.classList.toggle('open');
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.dots-menu.open').forEach(m => m.classList.remove('open'));
    });

    function toggleFeedSound(postId) {
      const p = appState.posts.find(x => x.id === postId);
      if (!p) return;
      p.soundOn = !p.soundOn;
      saveAppState();
      renderFeedPage();
    }

    function likeFeedPost(postId) {
      const p = appState.posts.find(x => x.id === postId);
      if (!p) return;
      p.liked = !p.liked;
      p.likes += p.liked ? 1 : -1;
      saveAppState();
      renderFeedPage();
    }

    function shareFeedPost(postId) {
      const link = `${window.location.origin}${window.location.pathname}#${postId}`;
      if (navigator.share) {
        navigator.share({ title: 'runotoks', url: link }).catch(() => {});
      } else {
        navigator.clipboard?.writeText(link).catch(() => {});
        toast('Ссылка скопирована');
      }
      document.querySelectorAll('.dots-menu.open').forEach(m => m.classList.remove('open'));
    }

    function deleteFeedPost(postId) {
      appState.posts = appState.posts.filter(p => p.id !== postId);
      saveAppState();
      toast('Пост удалён');
      if (document.getElementById('postDetailPage').classList.contains('active')) {
        switchPage('feedPage');
      } else {
        renderFeedPage();
      }
    }

    function openPostDetailPage(postId) {
      const post = appState.posts.find(p => p.id === postId);
      if (!post) return;

      let mediaHtml = '';
      if (post.mediaUrl) {
        mediaHtml = post.mediaType === 'video'
          ? `<div class="detail-media-large"><video src="${esc(post.mediaUrl)}" controls playsinline></video></div>`
          : `<div class="detail-media-large"><img src="${esc(post.mediaUrl)}" alt="Медиа" /></div>`;
      }

      const commentsHtml = post.comments.map(c => `
        <div style="background:#1e293b; padding:10px 14px; border-radius:12px; margin-bottom:8px; font-size:14px;">
          <strong style="color:var(--green);">${esc(c.author)}:</strong> ${esc(c.text)}
        </div>
      `).join('');

      document.getElementById('postDetailContainer').innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <div style="display:flex; align-items:center; gap:10px;">
            <div class="avatar-circle">${esc(post.author.slice(0, 1).toUpperCase())}</div>
            <div>
              <div style="font-weight:800;">${esc(post.author)}</div>
              <div style="font-size:12px; color:#94a3b8;">${esc(post.date)}</div>
            </div>
          </div>
          <div style="display:flex; gap:8px;">
            <button type="button" class="pill-stat-btn" onclick="shareFeedPost('${post.id}')">📤 Отправить</button>
            ${appState.isOwner ? `<button type="button" class="pill-stat-btn" style="color:#f87171;" onclick="deleteFeedPost('${post.id}')">🗑️ Удалить</button>` : ''}
          </div>
        </div>
        ${mediaHtml}
        <div style="font-size:16px; line-height:1.65; white-space:pre-wrap; margin-bottom:18px;">${esc(post.text)}</div>
        <div style="margin-bottom:12px; font-weight:700;">Комментарии (${post.comments.length})</div>
        <div>${commentsHtml}</div>
        <form style="display:flex; gap:8px; margin-top:10px;" onsubmit="addDetailComment(event, '${post.id}')">
          <input type="text" id="detailCommentInput" class="dark-field" style="margin-bottom:0; flex:1;" placeholder="Написать комментарий..." required />
          <button type="submit" class="btn-blue" style="padding:10px 16px; border-radius:12px;">Отпр.</button>
        </form>
      `;

      switchPage('postDetailPage');
    }

    function addDetailComment(e, postId) {
      e.preventDefault();
      const input = document.getElementById('detailCommentInput');
      const val = input.value.trim();
      if (!val) return;
      const post = appState.posts.find(p => p.id === postId);
      if (!post) return;
      post.comments.push({ author: appState.profile.name, text: val });
      saveAppState();
      openPostDetailPage(postId);
    }

    /* CHAT ROULETTE + CALLS + FONTS */
    function setChatFont(fontKey, btn) {
      appState.selectedFont = fontKey;
      document.querySelectorAll('.font-chip').forEach(c => c.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    function transformTextWithFont(text, fontKey) {
      if (fontKey === 'fancy') {
        const normal = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
        const fancy  = '𝒜𝐵𝒞𝒟𝐸𝐹𝒢𝐻𝐼𝒥𝒦𝐿𝑀𝒩𝒪𝒫𝒬𝑅𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵𝒶𝒷𝒸𝒹𝑒𝒻𝑔𝒽𝒾𝒿𝓀𝓁𝓂𝓃𝑜𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏';
        return text.split('').map(ch => {
          const idx = normal.indexOf(ch);
          return idx >= 0 ? Array.from(fancy)[idx] : ch;
        }).join('');
      }
      return text;
    }

    function getFontCssStyle(fontKey) {
      if (fontKey === 'mono') return 'font-family: var(--font-mono);';
      if (fontKey === 'serif') return 'font-family: var(--font-serif);';
      if (fontKey === 'rounded') return 'font-family: var(--font-rounded);';
      if (fontKey === 'bold-caps') return 'font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;';
      return '';
    }

    function rouletteNextPeer() {
      endCall();
      const dot = document.getElementById('rouletteDot');
      const title = document.getElementById('roulettePeerTitle');
      dot.classList.add('searching');
      title.textContent = 'Поиск...';
      appState.rouletteChat = [{ type: 'system', text: 'Поиск собеседника...' }];
      renderRouletteChat();

      setTimeout(() => {
        const randId = Math.floor(1000 + Math.random() * 8999);
        appState.roulettePeer = `Собеседник #${randId}`;
        dot.classList.remove('searching');
        title.textContent = `${appState.roulettePeer} (Онлайн)`;
        appState.rouletteChat = [
          { type: 'system', text: `Подключено: ${appState.roulettePeer}` },
          { type: 'peer', font: 'default', text: 'Привет!' }
        ];
        saveAppState();
        renderRouletteChat();
      }, 600);
    }

    function renderRouletteChat() {
      const box = document.getElementById('rouletteMessages');
      box.innerHTML = '';
      appState.rouletteChat.forEach(m => {
        const div = document.createElement('div');
        if (m.type === 'system') {
          div.className = 'msg-bubble system';
          div.textContent = m.text;
        } else {
          div.className = `msg-bubble ${m.type === 'me' ? 'me' : 'peer'}`;
          div.style = getFontCssStyle(m.font || 'default');
          div.textContent = m.text;
        }
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    function sendRouletteMessage(e) {
      e.preventDefault();
      const input = document.getElementById('rouletteInput');
      const rawText = input.value.trim();
      if (!rawText) return;

      const styledText = transformTextWithFont(rawText, appState.selectedFont);
      appState.rouletteChat.push({
        type: 'me',
        font: appState.selectedFont,
        text: styledText
      });
      input.value = '';
      saveAppState();
      renderRouletteChat();

      setTimeout(() => {
        const replies = ['Привет! Как дела?', 'Слышно отлично!', 'Классный шрифт 👍'];
        const reply = replies[Math.floor(Math.random() * replies.length)];
        appState.rouletteChat.push({ type: 'peer', font: 'default', text: reply });
        saveAppState();
        renderRouletteChat();
      }, 650);
    }

    async function startCall(mode) {
      const stage = document.getElementById('callStage');
      const endBtn = document.getElementById('endCallBtn');
      const statusText = document.getElementById('callStatusText');
      const localVid = document.getElementById('localVideo');

      stage.classList.add('active');
      endBtn.style.display = 'inline-block';
      statusText.textContent = mode === 'video' ? '📹 Видеозвонок' : '📞 Аудиозвонок';
      document.getElementById('remotePeerCallName').textContent = appState.roulettePeer;

      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          localMediaStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: mode === 'video'
          });
          localVid.srcObject = localMediaStream;
        }
      } catch (err) {
        toast('Звонок запущен');
      }

      clearInterval(callTimerInterval);
      callSeconds = 0;
      callTimerInterval = setInterval(() => {
        callSeconds += 1;
        const mm = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const ss = String(callSeconds % 60).padStart(2, '0');
        document.getElementById('callTimerText').textContent = `${mm}:${ss}`;
      }, 1000);
    }

    function endCall() {
      clearInterval(callTimerInterval);
      document.getElementById('callStage').classList.remove('active');
      document.getElementById('endCallBtn').style.display = 'none';
      document.getElementById('callTimerText').textContent = '00:00';
      if (localMediaStream) {
        localMediaStream.getTracks().forEach(t => t.stop());
        localMediaStream = null;
      }
    }

    /* SEARCH & PROFILE */
    function renderPeopleList(q) {
      const query = q.trim().toLowerCase();
      const users = [
        { name: appState.profile.name, handle: '@runotoks', role: 'Владелец' },
        { name: 'Собеседник #4821', handle: '@user4821', role: 'Чат-рулетка' }
      ].filter(u => !query || u.name.toLowerCase().includes(query) || u.handle.toLowerCase().includes(query));

      document.getElementById('peopleListContainer').innerHTML = users.map(u => `
        <div style="background:#162033; padding:12px 14px; border-radius:14px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:800;">${esc(u.name)} <span style="font-size:12px; color:#94a3b8;">${esc(u.handle)}</span></div>
            <div style="font-size:12px; color:var(--green);">${esc(u.role)}</div>
          </div>
          <button type="button" class="pill-stat-btn" onclick="switchPage('roulettePage')">Написать / Позвонить</button>
        </div>
      `).join('');
    }

    function renderProfilePage() {
      document.getElementById('profileLetter').textContent = (appState.profile.name || 'R').slice(0, 1).toUpperCase();
      document.getElementById('profileNameTitle').textContent = appState.profile.name;
      document.getElementById('profileRoleBadge').textContent = appState.isOwner ? 'Владелец' : 'Гость';
      document.getElementById('profileNameInput').value = appState.profile.name;
      document.getElementById('profileBioInput').value = appState.profile.bio;
    }

    function saveProfile() {
      const name = document.getElementById('profileNameInput').value.trim();
      const bio = document.getElementById('profileBioInput').value.trim();
      if (!name) return;
      appState.profile.name = name;
      appState.profile.bio = bio;
      saveAppState();
      renderProfilePage();
      toast('Сохранено');
    }

    function init() {
      applyOwnerPermissions();
      updateCartCounter();
      renderFeedPage();
      renderProductsPage();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
