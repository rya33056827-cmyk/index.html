<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runotoks — Магазин, чат и звонки</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #11161d;
      --panel-2: #18202c;
      --panel-3: #222c3c;
      --text: #f3f6fa;
      --muted: #9fb0c7;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.2);
      --danger-text: #fca5a5;
      --ok-bg: #14532d;
      --ok-text: #dcfce7;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.45;
    }

    .rt-wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .rt-wrap {
        grid-template-columns: 1fr;
        padding: 10px;
      }
    }

    .rt-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    .rt-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
    }

    .rt-brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .rt-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .rt-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
    }

    .rt-tab {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: none;
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .rt-tab.active {
      background: var(--accent);
      color: #fff;
    }

    .rt-shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
      padding: 16px;
    }

    .rt-product {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .rt-product-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .rt-product-desc {
      font-size: 12px;
      color: var(--muted);
    }

    .rt-product-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .rt-price {
      font-weight: 700;
      font-size: 14px;
    }

    .rt-cart-box {
      margin: 0 16px 16px;
      padding: 12px 14px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
    }

    .rt-cart-items {
      margin: 8px 0;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Стили мессенджера и звонков */
    .rm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .rm-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .rm-title-wrap {
      min-width: 0;
    }

    .rm-title {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rm-subtitle {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rm-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .rm-icon-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
    }

    .rm-icon-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .rm-primary-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .rm-primary-btn:hover {
      background: var(--accent-hover);
    }

    .rm-mini-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: none;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .rm-mini-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .rm-mini-btn.danger {
      background: var(--danger-soft);
      color: var(--danger-text);
    }

    .rm-mini-btn.danger:hover {
      background: rgba(239, 68, 68, 0.34);
    }

    .rm-auth-panel {
      padding: 22px 16px;
      text-align: center;
      display: none;
    }

    .rm-auth-panel.active {
      display: block;
    }

    .rm-auth-panel p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .rm-list {
      max-height: 450px;
      overflow-y: auto;
    }

    .rm-user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      gap: 10px;
    }

    .rm-user-row:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .rm-user-main {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .rm-user-name {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rm-user-sub {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rm-mini-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .rm-dialog {
      display: none;
      flex-direction: column;
      height: 500px;
    }

    .rm-dialog.active {
      display: flex;
    }

    .rm-call-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: var(--ok-bg);
      color: var(--ok-text);
      font-size: 13px;
    }

    .rm-call-banner.active {
      display: flex;
    }

    .rm-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rm-msg {
      max-width: 78%;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 14px;
      word-break: break-word;
      background: var(--panel-3);
    }

    .rm-msg.mine {
      align-self: flex-end;
      background: var(--accent);
    }

    .rm-form {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: var(--panel-2);
      border-top: 1px solid var(--border);
    }

    .rm-input {
      flex: 1;
      background: #0b1017;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    .rm-input:focus {
      border-color: var(--accent);
    }

    .rm-send {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .rm-error {
      padding: 8px 12px;
      font-size: 12px;
      color: var(--danger-text);
      background: rgba(127, 29, 29, 0.35);
      display: none;
    }

    .rm-error.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="rt-wrap">
    <!-- ЛЕВАЯ КОЛОНКА: МАГАЗИН RUNOTOKS -->
    <section class="rt-card" id="runotoksShop">
      <div class="rt-topbar">
        <div>
          <div class="rt-brand">RUNOTOKS</div>
          <div class="rt-sub">Каталог и заказ</div>
        </div>
        <div class="rt-sub" id="rtCartCount">Корзина: 0</div>
      </div>

      <div class="rt-tabs">
        <button type="button" class="rt-tab active" data-cat="all">Все товары</button>
        <button type="button" class="rt-tab" data-cat="audio">Аудио</button>
        <button type="button" class="rt-tab" data-cat="accessories">Аксессуары</button>
      </div>

      <div class="rt-shop-grid" id="rtProductsGrid"></div>

      <div class="rt-cart-box">
        <strong>Корзина</strong>
        <div class="rt-cart-items" id="rtCartItems">Пока пусто</div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
          <span id="rtCartTotal">Итого: 0 грн</span>
          <button type="button" class="rm-primary-btn" id="rtCheckoutBtn">Оформить заказ</button>

    <!-- ПРАВАЯ КОЛОНКА: МЕССЕНДЖЕР И ЗВОНКИ -->
    <section class="rt-card" id="runotoksMessenger">
      <div id="rmUsersScreen">
        <div class="rm-header">
          <div class="rm-header-left">
            <div class="rm-title-wrap">
              <div class="rm-title">Чаты</div>
              <div class="rm-subtitle" id="rmCurrentUserLabel">Подключение...</div>
            </div>
          </div>
        </div>

        <div class="rm-error" id="rmErrorBox"></div>

        <div class="rm-auth-panel" id="rmAuthPanel">
          <p>Войдите через Google, чтобы открыть диалоги и звонки.</p>
          <button type="button" class="rm-primary-btn" id="rmGoogleLoginBtn">Войти через Google</button>
        </div>

        <div class="rm-list" id="rmUsersList"></div>
      </div>

      <div class="rm-dialog" id="rmDialogScreen">
        <div class="rm-header">
          <div class="rm-header-left">
            <button type="button" class="rm-icon-btn" id="rmBackBtn" title="Назад к диалогам">←</button>
            <div class="rm-title-wrap">
              <div class="rm-title" id="rmPeerName">Собеседник</div>
              <div class="rm-subtitle" id="rmPeerStatus">диалог</div>
            </div>
          </div>
          <div class="rm-actions">
            <button type="button" class="rm-icon-btn" id="rmCallBtn" title="Позвонить">📞</button>
            <button type="button" class="rm-mini-btn" id="rmBlockPeerBtn">Блок</button>
            <button type="button" class="rm-mini-btn danger" id="rmDeletePeerBtn">Удалить</button>

        <div class="rm-messages" id="rmMessagesList"></div>

        <form class="rm-form" id="rmMessageForm">
          <input
            type="text"

            id="rmMessageInput"
            placeholder="Написать сообщение..."

          />
          <button type="submit" class="rm-send">➤</button>
        </form>
      </div>
    </section>
  </div>

  <audio id="rmRemoteAudio" autoplay playsinline></audio>

  <!-- ЛОГИКА МАГАЗИНА -->
  <script>
    const products = [
      { id: 1, title: "Наушники P47 Wireless", cat: "audio", price: 450, desc: "Беспроводные накладные наушники с басами и слотом карты." },
      { id: 2, title: "Аккумулятор 21700 Li-Ion", cat: "accessories", price: 320, desc: "Высокотоковый элемент питания повышенной ёмкости." },
      { id: 3, title: "Кабель USB-C Fast Charge", cat: "accessories", price: 180, desc: "Усиленный кабель для зарядки и передачи данных." },
      { id: 4, title: "Портативный усилитель Bass", cat: "audio", price: 890, desc: "Компактный модуль для чистого звучания и глубоких низких частот." }
    ];

    const productsGrid = document.getElementById("rtProductsGrid");
    const cartItemsEl = document.getElementById("rtCartItems");
    const cartCountEl = document.getElementById("rtCartCount");
    const cartTotalEl = document.getElementById("rtCartTotal");
    const checkoutBtn = document.getElementById("rtCheckoutBtn");
    const tabs = document.querySelectorAll(".rt-tab");

    let activeCat = "all";
    let cart = [];

    function renderProducts() {
      productsGrid.innerHTML = "";
      const list = activeCat === "all" ? products : products.filter((p) => p.cat === activeCat);
      list.forEach((item) => {
        const card = document.createElement("div");
        card.className = "rt-product";
        card.innerHTML = `
          <div>
            <div class="rt-product-title">${item.title}</div>
            <div class="rt-product-desc">${item.desc}</div>
          </div>
          <div class="rt-product-foot">
            <span class="rt-price">${item.price} грн</span>
            <button type="button" class="rm-mini-btn" data-add="${item.id}">В корзину</button>
          </div>
        `;
        card.querySelector("[data-add]").addEventListener("click", () => {
          cart.push(item);
          renderCart();
        });
        productsGrid.append(card);
      });
    }

    function renderCart() {
      cartCountEl.textContent = `Корзина: ${cart.length}`;
      if (!cart.length) {
        cartItemsEl.textContent = "Пока пусто";
        cartTotalEl.textContent = "Итого: 0 грн";
        return;
      }
      cartItemsEl.innerHTML = cart.map((i, idx) => `<div>${idx + 1}. ${i.title} — ${i.price} грн</div>`).join("");
      const sum = cart.reduce((acc, i) => acc + i.price, 0);
      cartTotalEl.textContent = `Итого: ${sum} грн`;
    }

    tabs.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabs.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeCat = btn.dataset.cat;
        renderProducts();
      });
    });

    checkoutBtn.addEventListener("click", () => {
      if (!cart.length) return;
      alert(`Заказ оформлен (${cart.length} поз.). Свяжитесь в чате при необходимости.`);
      cart = [];
      renderCart();
    });

    renderProducts();
    renderCart();
  </script>

  <!-- ЛОГИКА FIREBASE, ДИАЛОГОВ, БЛОКИРОВКИ, УДАЛЕНИЯ И ЗВОНКОВ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      addDoc,
      deleteDoc,
      onSnapshot,
      query,
      where,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "runotoks-c05c2.firebaseapp.com",
      projectId: "runotoks-c05c2",
      storageBucket: "runotoks-c05c2.firebasestorage.app",
      messagingSenderId: "000000000000",
      appId: "1:000000000000:web:0000000000000000"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const usersScreen = document.getElementById("rmUsersScreen");
    const dialogScreen = document.getElementById("rmDialogScreen");
    const authPanel = document.getElementById("rmAuthPanel");
    const googleLoginBtn = document.getElementById("rmGoogleLoginBtn");
    const usersListEl = document.getElementById("rmUsersList");
    const messagesListEl = document.getElementById("rmMessagesList");
    const messageForm = document.getElementById("rmMessageForm");
    const messageInput = document.getElementById("rmMessageInput");
    const backBtn = document.getElementById("rmBackBtn");
    const callBtn = document.getElementById("rmCallBtn");
    const hangupBtn = document.getElementById("rmHangupBtn");
    const callBanner = document.getElementById("rmCallBanner");
    const callText = document.getElementById("rmCallText");
    const blockPeerBtn = document.getElementById("rmBlockPeerBtn");
    const deletePeerBtn = document.getElementById("rmDeletePeerBtn");
    const peerNameEl = document.getElementById("rmPeerName");
    const currentUserLabel = document.getElementById("rmCurrentUserLabel");
    const errorBox = document.getElementById("rmErrorBox");
    const remoteAudio = document.getElementById("rmRemoteAudio");

    let me = null;
    let activePeer = null;
    let activeChatId = null;
    let blockedIds = new Set();
    let hiddenIds = new Set();
    let allUsers = [];
    let unsubMessages = null;
    let unsubCall = null;
    let unsubCandidates = null;
    let localStream = null;
    let peerConnection = null;

    const rtcConfig = {
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    };

    function showError(msg) {
      if (!msg) {
        errorBox.textContent = "";
        errorBox.classList.remove("active");
        return;
      }
      errorBox.textContent = msg;
      errorBox.classList.add("active");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function makePairKey(uidA, uidB) {
      return [uidA, uidB].sort().join("_");
    }

    function renderUsersList() {
      usersListEl.innerHTML = "";
      if (!me) return;

      const visibleUsers = allUsers.filter(
        (u) => u.id !== me.uid && !blockedIds.has(u.id) && !hiddenIds.has(u.id)
      );

      if (!visibleUsers.length) {
        usersListEl.innerHTML =
          '<div class="rm-user-row"><div class="rm-user-sub">Пока нет других пользователей</div></div>';
        return;
      }

      visibleUsers.forEach((user) => {
        const title = user.displayName || user.name || user.username || user.email || user.id;
        const row = document.createElement("div");
        row.className = "rm-user-row";

        const main = document.createElement("div");
        main.className = "rm-user-main";
        main.innerHTML = `
          <div class="rm-user-name">${escapeHtml(title)}</div>
          <div class="rm-user-sub">${escapeHtml(user.username ? "@" + user.username : "Открыть диалог")}</div>
        `;
        main.addEventListener("click", () => openDialog(user));

        const actions = document.createElement("div");
        actions.className = "rm-mini-actions";

        const blockBtn = document.createElement("button");
        blockBtn.type = "button";
        blockBtn.className = "rm-mini-btn";
        blockBtn.textContent = "Блок";
        blockBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          blockUser(user.id);
        });

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "rm-mini-btn danger";
        delBtn.textContent = "Удалить";
        delBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteUserFromList(user.id);
        });

        actions.append(blockBtn, delBtn);
        row.append(main, actions);
        usersListEl.append(row);
      });
    }

    async function openDialog(peer) {
      if (!me || !peer) return;
      showError("");
      activePeer = peer;
      const pairKey = makePairKey(me.uid, peer.id);
      activeChatId = pairKey;

      peerNameEl.textContent = peer.displayName || peer.name || peer.username || peer.email || peer.id;
      usersScreen.style.display = "none";
      dialogScreen.classList.add("active");

      try {
        await setDoc(
          doc(db, "chats", activeChatId),
          {
            members: [me.uid, peer.id],
            pairKey,
            updatedAt: serverTimestamp()
          },
          { merge: true }
        );
      } catch (err) {
        showError("Не удалось создать диалог: " + err.message);
      }

      subscribeMessages(activeChatId);
      subscribeCall(activeChatId);
    }

    async function backToUsers() {
      await hangupCall();
      activePeer = null;
      activeChatId = null;
      if (unsubMessages) {
        unsubMessages();
        unsubMessages = null;
      }
      if (unsubCall) {
        unsubCall();
        unsubCall = null;
      }
      if (unsubCandidates) {
        unsubCandidates();
        unsubCandidates = null;
      }
      dialogScreen.classList.remove("active");
      usersScreen.style.display = "block";
      renderUsersList();
    }

    function subscribeMessages(chatId) {
      if (unsubMessages) unsubMessages();
      messagesListEl.innerHTML = "";

      const q = query(collection(db, "messages"), where("chatId", "==", chatId));

      unsubMessages = onSnapshot(
        q,
        (snap) => {
          const items = [];
          snap.forEach((docSnap) => {
            items.push({ id: docSnap.id, ...docSnap.data() });
          });

          items.sort((a, b) => {
            const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : Date.now();
            const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : Date.now();
            return ta - tb;
          });

          messagesListEl.innerHTML = "";
          items.forEach((data) => {
            const div = document.createElement("div");
            div.className = "rm-msg" + (data.senderId === me.uid ? " mine" : "");
            div.textContent = data.text || "";
            messagesListEl.append(div);
          });
          messagesListEl.scrollTop = messagesListEl.scrollHeight;
        },
        (err) => {
          showError("Ошибка чтения сообщений: " + err.message);
        }
      );
    }

    messageForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !me || !activePeer || !activeChatId) return;
      if (blockedIds.has(activePeer.id)) return;

      messageInput.value = "";

      try {
        await addDoc(collection(db, "messages"), {
          chatId: activeChatId,
          pairKey: activeChatId,
          senderId: me.uid,
          receiverId: activePeer.id,
          text,
          createdAt: serverTimestamp()
        });

        await setDoc(
          doc(db, "chats", activeChatId),
          {
            members: [me.uid, activePeer.id],
            pairKey: activeChatId,
            lastMessage: text,
            updatedAt: serverTimestamp()
          },
          { merge: true }
        );
      } catch (err) {
        showError("Не удалось отправить сообщение: " + err.message);
      }
    });

    async function blockUser(targetUid) {
      if (!me || !targetUid) return;
      blockedIds.add(targetUid);
      await setDoc(doc(db, "users", me.uid, "blocked", targetUid), {
        blockedAt: serverTimestamp()
      });
      if (activePeer?.id === targetUid) {
        await backToUsers();
      } else {
        renderUsersList();
      }
    }

    async function deleteUserFromList(targetUid) {
      if (!me || !targetUid) return;
      hiddenIds.add(targetUid);
      await setDoc(doc(db, "users", me.uid, "hiddenUsers", targetUid), {
        hiddenAt: serverTimestamp()
      });
      if (activePeer?.id === targetUid) {
        await backToUsers();
      } else {
        renderUsersList();
      }
    }

    async function setupLocalAudio() {
      if (localStream) return localStream;
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      return localStream;
    }

    async function createPeerConnection(chatId) {
      if (peerConnection) peerConnection.close();
      peerConnection = new RTCPeerConnection(rtcConfig);

      const stream = await setupLocalAudio();
      stream.getTracks().forEach((track) => {
        peerConnection.addTrack(track, stream);
      });

      peerConnection.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteAudio.srcObject = event.streams[0];
        }
      };

      peerConnection.onicecandidate = async (event) => {
        if (event.candidate && me && chatId) {
          await addDoc(collection(db, "chats", chatId, "call", "current", "candidates"), {
            senderId: me.uid,
            candidate: event.candidate.toJSON()
          });
        }
      };

      return peerConnection;
    }

    async function startCall() {
      if (!me || !activePeer || !activeChatId) return;
      try {
        const pc = await createPeerConnection(activeChatId);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await setDoc(doc(db, "chats", activeChatId, "call", "current"), {
          callerId: me.uid,
          callerName: me.displayName || me.email || "Пользователь",
          calleeId: activePeer.id,
          offer: { type: offer.type, sdp: offer.sdp },
          status: "calling",
          updatedAt: serverTimestamp()
        });

        callText.textContent = `Звонок ${peerNameEl.textContent}...`;
        callBanner.classList.add("active");
      } catch (err) {
        callText.textContent = "Нет доступа к микрофону";
        callBanner.classList.add("active");
      }
    }

    async function hangupCall() {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach((t) => t.stop());
        localStream = null;
      }
      if (activeChatId) {
        await deleteDoc(doc(db, "chats", activeChatId, "call", "current")).catch(() => {});
      }
      callBanner.classList.remove("active");
    }

    function subscribeCall(chatId) {
      if (unsubCall) unsubCall();
      if (unsubCandidates) unsubCandidates();

      unsubCandidates = onSnapshot(
        collection(db, "chats", chatId, "call", "current", "candidates"),
        async (snap) => {
          if (!peerConnection || !me) return;
          for (const change of snap.docChanges()) {
            if (change.type === "added") {
              const cData = change.doc.data();
              if (cData.senderId !== me.uid && cData.candidate) {
                try {
                  await peerConnection.addIceCandidate(new RTCIceCandidate(cData.candidate));
                } catch (_) {}
              }
            }
          }
        }
      );

      unsubCall = onSnapshot(doc(db, "chats", chatId, "call", "current"), async (snap) => {
        if (!snap.exists()) {
          callBanner.classList.remove("active");
          return;
        }
        const data = snap.data();
        callBanner.classList.add("active");

        if (data.callerId === me.uid) {
          callText.textContent = data.answer
            ? "Соединение установлено"
            : `Звонок ${peerNameEl.textContent}...`;
          if (data.answer && peerConnection && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
          }
        } else {
          callText.textContent = `Входящий звонок от ${data.callerName || peerNameEl.textContent}`;
          if (data.offer && !peerConnection) {
            try {
              const pc = await createPeerConnection(chatId);
              await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
              const answer = await pc.createAnswer();
              await pc.setLocalDescription(answer);
              await setDoc(
                doc(db, "chats", chatId, "call", "current"),
                { answer: { type: answer.type, sdp: answer.sdp }, status: "connected" },
                { merge: true }
              );
              callText.textContent = "Соединение установлено";
            } catch (_) {}
          }
        }
      });
    }

    googleLoginBtn.addEventListener("click", async () => {
      showError("");
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        if (
          err.code === "auth/popup-blocked" ||
          err.code === "auth/operation-not-supported-in-this-environment"
        ) {
          await signInWithRedirect(auth, provider);
        } else {
          showError("Ошибка входа: " + err.message);
        }
      }
    });

    backBtn.addEventListener("click", backToUsers);
    callBtn.addEventListener("click", startCall);
    hangupBtn.addEventListener("click", hangupCall);
    blockPeerBtn.addEventListener("click", () => activePeer && blockUser(activePeer.id));
    deletePeerBtn.addEventListener("click", () => activePeer && deleteUserFromList(activePeer.id));

    onAuthStateChanged(auth, async (user) => {
      me = user || null;

      if (!me) {
        currentUserLabel.textContent = "Требуется вход через Google";
        authPanel.classList.add("active");
        usersListEl.innerHTML = "";
        return;
      }

      authPanel.classList.remove("active");
      currentUserLabel.textContent = me.displayName || me.email || "Аккаунт активен";

      try {
        await setDoc(
          doc(db, "users", me.uid),
          {
            uid: me.uid,
            displayName: me.displayName || "",
            email: me.email || "",
            updatedAt: serverTimestamp()
          },
          { merge: true }
        );
      } catch (err) {
        showError("Не удалось сохранить профиль: " + err.message);
      }

      onSnapshot(collection(db, "users", me.uid, "blocked"), (snap) => {
        blockedIds = new Set(snap.docs.map((d) => d.id));
        renderUsersList();
      });

      onSnapshot(collection(db, "users", me.uid, "hiddenUsers"), (snap) => {
        hiddenIds = new Set(snap.docs.map((d) => d.id));
        renderUsersList();
      });

      onSnapshot(collection(db, "users"), (snap) => {
        allUsers = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderUsersList();
      });
    });
  </script>
</body>
</html>
